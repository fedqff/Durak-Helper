<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Durak Helper</title>
    <meta
      name="description"
      content="Card tracker for the card game of Durak."
    />
    <link rel="icon" href="./assets/favicon.ico" />
    <link rel="icon" href="./assets/favicon.svg" />
    <link rel="stylesheet" type="text/css" href="./style/reset.css" />
    <link rel="stylesheet" type="text/css" href="./style/fonts.css" />
    <link rel="stylesheet" type="text/css" href="./style/styles.css" />
    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- IOS support -->
    <link rel="apple-touch-icon" href="./assets/icons/180x180.png" />
    <meta name="apple-mobile-web-app-status-bar" content="#192d5a" />
    <meta name="theme-color" content="#192d5a" />
  </head>
  <body>
    <header>
      <div class="title-controls">
        <h1 id="title">Durak Helper</h1>
        <div class="deck-selector-compact">
          <span id="selected-deck-size">36</span>
          <select id="deck-size" aria-label="Deck size">
	    <option value="24">24 cards</option>
            <option value="36">36 cards</option>
            <option value="52">52 cards</option>
            <option value="54">54 cards (with Jokers)</option>
          </select>
        </div>
      </div>
      <div class="state-controls">
        <button id="undo-controls-button" class="controls-button">
          <img
            src="./assets/undo_24dp.svg"
            draggable="false"
            alt="Undo last action"
          />
        </button>
        <button id="redo-controls-button" class="controls-button">
          <img
            src="./assets/redo_24dp.svg"
            draggable="false"
            alt="Redo last action"
          />
        </button>
        <button id="reset-controls-button" class="controls-button">
          <img
            src="./assets/restart_alt_24dp.svg"
            draggable="false"
            alt="Restart"
          />
        </button>
      </div>
    </header>

    <div id="content">
      <div id="card-grid"></div>
    </div>

    <footer>
      <div id="action-button-container">
        <button id="mine-action-button">Mine</button>
        <button id="enemy-action-button">Enemy's</button>
        <button id="discard-action-button">Discard</button>
      </div>
    </footer>

    <script src="./js/script.js"></script>
  </body>
</html>
